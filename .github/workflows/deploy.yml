name: Deploy to Pages

on:
  push:
    branches: [main]
  # Lets you redeploy the current main by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the last
# push to main is always what ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A broken build should never reach the playtest URL.
      - name: Typecheck and test
        run: npm run check

      # Pages serves a project site from /<repo>/, so the built asset URLs
      # need that prefix. Taken from the repository name rather than the Pages
      # API: GITHUB_TOKEN cannot read or create the Pages site on a repo where
      # Pages has not been switched on by hand, and the build should not need
      # to. (A <user>.github.io repo would want BASE_PATH=/ instead.)
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Requires Pages to be on, with Settings -> Pages -> Source set to
      # "GitHub Actions". That is a one-time switch; GITHUB_TOKEN is not
      # allowed to set it.
      - id: deployment
        uses: actions/deploy-pages@v4
